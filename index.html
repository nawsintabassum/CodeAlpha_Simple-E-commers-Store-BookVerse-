<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookVerse - Online Bookstore</title>
    <meta http-equiv="refresh" content="0; url=./frontend/index.html">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7fe;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .redirect-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            max-width: 400px;
        }
        h1 {
            color: #2563eb;
            margin-bottom: 10px;
        }
        p {
            color: #64748b;
            margin-bottom: 20px;
        }
        a {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background 0.3s;
        }
        a:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="redirect-card">
        <h1>Welcome to BookVerse</h1>
        <p>Redirecting you to the bookstore...</p>
        <a href="./frontend/index.html">Click here if not redirected</a>
    </div>

    <script>
       
        window.location.href = "./frontend/index.html";
    </script>
</body>
</html>
